name: Pull Request
on:
  pull_request:
    branches:
      - main
    paths:
      - 'main.go'
      - 'cmd/**'
      - 'internal/**'
      - Dockerfile
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits-pr:
    if: github.event.pull_request.draft == false
    name: Validate Conventional Commits PR
    runs-on: ubuntu-latest
    steps:
      - uses: crazy-max/ghaction-dump-context@v1
      - uses: catalystsquad/action-validate-conventional-commits-pr@v1
  ensure-compile:
    if: github.event.pull_request.draft == false
    name: Ensure project compiles
    runs-on: ubuntu-latest
    steps:
      - uses: crazy-max/ghaction-dump-context@v1
      - name: Auth Github
        run: |
          git config --global url."https://${{ secrets.AUTOMATION_PAT }}@github.com".insteadOf "https://github.com"
      - name: Compile
        uses: catalystsquad/action-compile-go@v1
        with: 
          go-version: ~1.21

  test:
    needs:
      - ensure-compile
    name: Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taikai_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: taikai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://taikai_test:test_password@localhost:5432/taikai_test?sslmode=disable
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-for-ci-cd-only
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM_EMAIL: noreply@taikai.test
      SMTP_FROM_NAME: Taikai Test

    steps:
      - name: Dump Context
        uses: crazy-max/ghaction-dump-context@v1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.21

      - name: Auth Github
        run: |
          git config --global url."https://${{ secrets.AUTOMATION_PAT }}@github.com".insteadOf "https://github.com"

      - name: Install dependencies
        run: go mod download

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.16.2/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
          migrate -version

      - name: Run database migrations
        run: |
          migrate -path internal/storage/migrations -database "$DATABASE_URL" up

      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 30

