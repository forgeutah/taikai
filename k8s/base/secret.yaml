# This is a template for secrets
# DO NOT commit actual secrets to git
# Use sealed-secrets, external-secrets, or kubectl create secret in production
apiVersion: v1
kind: Secret
metadata:
  name: taikai-secrets
  namespace: taikai
type: Opaque
stringData:
  # Database credentials
  DATABASE_USER: "taikai"
  DATABASE_PASSWORD: "CHANGEME_DATABASE_PASSWORD"

  # JWT Secret - MUST be changed in production
  JWT_SECRET: "CHANGEME_RANDOM_SECRET_KEY_AT_LEAST_32_CHARS"

  # Email SMTP credentials (if using authenticated SMTP)
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""

  # AWS SES credentials (if using SES)
  AWS_SES_REGION: "us-east-1"
  AWS_SES_ACCESS_KEY: ""
  AWS_SES_SECRET_KEY: ""

  # Twilio (for SMS - Phase 2)
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_PHONE_NUMBER: ""
