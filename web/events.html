<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Taikai</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="/">Taikai</a>
            </div>
            <div class="navbar-menu">
                <a href="/organizations.html">Organizations</a>
                <a href="/events.html" class="active">Events</a>
                <a href="/venues.html">Venues</a>
                <div id="authButtons">
                    <a href="/profile.html" class="btn btn-sm" id="profileBtn" style="display:none;">Profile</a>
                    <button onclick="auth.logout()" class="btn btn-sm btn-secondary" id="logoutBtn" style="display:none;">Logout</button>
                    <a href="/login.html" class="btn btn-sm btn-primary" id="loginBtn">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container main-content">
        <div class="hero-section">
            <h1>Discover Tech Events</h1>
            <p>Join local technology communities and meetups</p>
            <div class="hero-search">
                <input type="text" id="searchInput" placeholder="Search events..." class="search-input-large">
            </div>
        </div>

        <div class="filters-section">
            <div class="filter-group">
                <label>Organization</label>
                <select id="orgFilter" onchange="filterEvents()">
                    <option value="">All Organizations</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Group</label>
                <select id="groupFilter" onchange="filterEvents()">
                    <option value="">All Groups</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Time</label>
                <select id="timeFilter" onchange="filterEvents()">
                    <option value="upcoming">Upcoming</option>
                    <option value="past">Past</option>
                    <option value="all">All</option>
                </select>
            </div>
        </div>

        <div id="eventsContainer">
            <div class="loading">Loading events...</div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let allEvents = [];
        let organizations = [];
        let groups = [];

        document.addEventListener('DOMContentLoaded', () => {
            auth.updateUI();
            loadData();

            document.getElementById('searchInput').addEventListener('input', filterEvents);
        });

        async function loadData() {
            try {
                [allEvents, organizations, groups] = await Promise.all([
                    api.getEvents(),
                    api.getOrganizations(),
                    api.getGroups()
                ]);

                populateFilters();
                filterEvents();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('eventsContainer').innerHTML =
                    '<div class="error">Failed to load events</div>';
            }
        }

        function populateFilters() {
            const orgFilter = document.getElementById('orgFilter');
            const groupFilter = document.getElementById('groupFilter');

            orgFilter.innerHTML = '<option value="">All Organizations</option>' +
                organizations.map(org => `<option value="${org.id}">${escapeHtml(org.name)}</option>`).join('');

            groupFilter.innerHTML = '<option value="">All Groups</option>' +
                groups.map(group => `<option value="${group.id}">${escapeHtml(group.name)}</option>`).join('');
        }

        function filterEvents() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const orgId = document.getElementById('orgFilter').value;
            const groupId = document.getElementById('groupFilter').value;
            const timeFilter = document.getElementById('timeFilter').value;
            const now = new Date();

            let filtered = allEvents.filter(event => {
                // Search filter
                const matchesSearch = !searchQuery ||
                    event.title.toLowerCase().includes(searchQuery) ||
                    (event.description && event.description.toLowerCase().includes(searchQuery));

                // Organization filter
                const eventGroup = groups.find(g => g.id === event.group_id);
                const matchesOrg = !orgId || (eventGroup && eventGroup.organization_id === orgId);

                // Group filter
                const matchesGroup = !groupId || event.group_id === groupId;

                // Time filter
                const eventDate = new Date(event.start_time);
                let matchesTime = true;
                if (timeFilter === 'upcoming') {
                    matchesTime = eventDate >= now;
                } else if (timeFilter === 'past') {
                    matchesTime = eventDate < now;
                }

                return matchesSearch && matchesOrg && matchesGroup && matchesTime;
            });

            // Sort by start time
            filtered.sort((a, b) => {
                const dateA = new Date(a.start_time);
                const dateB = new Date(b.start_time);
                return timeFilter === 'past' ? dateB - dateA : dateA - dateB;
            });

            displayEvents(filtered);
        }

        function displayEvents(events) {
            const container = document.getElementById('eventsContainer');

            if (events.length === 0) {
                container.innerHTML = '<div class="empty-state">No events found</div>';
                return;
            }

            container.innerHTML = `
                <div class="events-grid">
                    ${events.map(event => renderEventCard(event)).join('')}
                </div>
            `;
        }

        function renderEventCard(event) {
            const startDate = new Date(event.start_time);
            const isPast = startDate < new Date();
            const group = groups.find(g => g.id === event.group_id);
            const org = organizations.find(o => group && o.id === group.organization_id);

            return `
                <div class="event-card ${isPast ? 'past-event' : ''}" onclick="window.location.href='/event.html?id=${event.id}'">
                    <div class="event-date">
                        <div class="event-month">${startDate.toLocaleDateString('en-US', { month: 'short' })}</div>
                        <div class="event-day">${startDate.getDate()}</div>
                    </div>
                    <div class="event-details">
                        <div class="event-meta-small">
                            ${org ? `<span class="badge badge-org">${escapeHtml(org.name)}</span>` : ''}
                            ${group ? `<span class="badge">${escapeHtml(group.name)}</span>` : ''}
                        </div>
                        <h3>${escapeHtml(event.title)}</h3>
                        <div class="event-meta">
                            <span>📅 ${startDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</span>
                            <span>🕐 ${startDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span>
                            ${event.capacity ? `
                                <span>👥 ${event.rsvp_count || 0}/${event.capacity}</span>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
